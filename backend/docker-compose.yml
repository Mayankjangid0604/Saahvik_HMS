# Dev database: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: saahvik
      POSTGRES_PASSWORD: saahvik
      POSTGRES_DB: saahvik
    ports:
      - "5432:5432"
    volumes:
      - saahvik-pgdata:/var/lib/postgresql/data

volumes:
  saahvik-pgdata:
